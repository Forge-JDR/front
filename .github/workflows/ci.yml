name: Vérifications front
on:
  push:
    branches: [main, reprise, refonte-uiux]
  pull_request:
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: node --test --test-isolation=none tests/reprise/auth.test.mjs
      - run: npm test -- --watchAll=false --runInBand
        env:
          CI: "true"
      - run: npm run lint:ui
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
        env:
          CI: "true"
      # Legacy pages still emit lint warnings; new MVP code is checked above.
      - run: npm run build
        env:
          REACT_APP_URL_BACK: http://localhost:8741
          CI: "false"
